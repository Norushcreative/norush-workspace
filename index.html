<style>

  .card-thumb-more { font-size: 10px; color: var(--muted); }
  .menu-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 3px; line-height: 1; border-radius: 4px; }

  .img-remove { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--paper); border: none; cursor: pointer; font-size: 10px; line-height: 1; }
  .modal-actions { display: flex; justify-content: space-between; margin-top: 20px; align-items: center; }
  .modal-actions-right { display: flex; gap: 8px; }

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STAGES = [
  { id: "inquiry", label: "Permintaan Baru" },
  { id: "concept", label: "Konsep & Draf" },
  { id: "revision", label: "Revisi Klien" },
  { id: "approval", label: "Persetujuan Akhir" },
  { id: "done", label: "Selesai & Dibayar" },
];
const WORK_TYPES = [
  { id: "logo", label: "Logo", color: "#3B5D50" },
  { id: "monogram", label: "Monogram", color: "#8B5E34" },
  { id: "wordmark", label: "Wordmark", color: "#C4622D" },
  { id: "lettering", label: "Lettering", color: "#5B5F97" },
  { id: "brandkit", label: "Brand Kit", color: "#2F5D62" },
  { id: "other", label: "Lainnya", color: "#6B6A62" },
];
const SOURCES = ["Fiverr", "Dribbble", "Instagram", "Langsung", "Lainnya"];

function fileToResizedDataURL(file, maxDim = 1000, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dueBadge(due) {
  if (!due) return null;
  const d = new Date(due + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { text: `Lewat ${Math.abs(diff)} hari`, tone: "late" };
  if (diff === 0) return { text: "Hari ini", tone: "today" };
  if (diff <= 3) return { text: `H-${diff}`, tone: "soon" };
  return { text: d.toLocaleDateString("id-ID", { day: "numeric", month: "short" }), tone: "normal" };
}

function formatPrice(p) {
  if (!p.price) return "—";
  if (p.currency === "USD") return `$${Number(p.price).toLocaleString("en-US")}`;
  return `Rp${Number(p.price).toLocaleString("id-ID")}`;
}

function emptyFormFor(filter) {
  const today = new Date();
  const year = filter.type !== "all" ? filter.year : today.getFullYear();
  const month = filter.type === "month" ? filter.month : today.getMonth() + 1;
  return { title: "", client: "", source: SOURCES[0], type: WORK_TYPES[0].id, price: "", currency: "IDR", due: "", images: [], stage: "inquiry", year, month };
}

function loadLS(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}

function ProjectBoard() {
  const [projects, setProjects] = useState(() => loadLS("norush_projects", null) || seedData());
  const [years, setYears] = useState(() => {
    const stored = loadLS("norush_years", null);
    if (stored) return stored;
    const y = new Date().getFullYear();
    return Array.from(new Set([y, ...seedData().map(p => p.year)]));
  });
  const [expanded, setExpanded] = useState({ [new Date().getFullYear()]: true });
  const [filter, setFilter] = useState({ type: "all" });
  const [storageOk, setStorageOk] = useState(true);
  const [query, setQuery] = useState("");
  const [modalOpen, setModalOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyFormFor({ type: "all" }));
  const [menuOpenId, setMenuOpenId] = useState(null);
  const [draggedId, setDraggedId] = useState(null);
  const [previewId, setPreviewId] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [workspaceSettingsOpen, setWorkspaceSettingsOpen] = useState(false);
  const [workspaceName, setWorkspaceName] = useState(() => loadLS("norush_workspace_name", "Norush Creative"));
  const [workspaceLogo, setWorkspaceLogo] = useState(() => loadLS("norush_workspace_logo", LOGO_SRC));
  const [workspaceDraft, setWorkspaceDraft] = useState({ name: workspaceName, logo: workspaceLogo });
  const menuRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem("norush_projects", JSON.stringify(projects)); setStorageOk(true); }
    catch (e) { setStorageOk(false); }
  }, [projects]);
  useEffect(() => {
    try { localStorage.setItem("norush_years", JSON.stringify(years)); }
    catch (e) { setStorageOk(false); }
  }, [years]);
  useEffect(() => {
    function onClick(e) { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpenId(null); }
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  useEffect(() => {
    try { localStorage.setItem("norush_workspace_name", workspaceName); } catch (e) {}
  }, [workspaceName]);
  useEffect(() => {
    try { localStorage.setItem("norush_workspace_logo", workspaceLogo); } catch (e) {}
  }, [workspaceLogo]);
  useEffect(() => {
    function onKeyDown(e) {
      if (e.key === "Escape") {
        if (lightbox) setLightbox(null);
        else if (previewId) setPreviewId(null);
        else if (workspaceSettingsOpen) setWorkspaceSettingsOpen(false);
      }
    }
    document.addEventListener("keydown", onKeyDown);
    return () => document.removeEventListener("keydown", onKeyDown);
  }, [lightbox, previewId, workspaceSettingsOpen]);

  function openWorkspaceSettings() {
    setWorkspaceDraft({ name: workspaceName, logo: workspaceLogo });
    setWorkspaceSettingsOpen(true);
  }
  function handleWorkspaceLogo(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setWorkspaceDraft(d => ({ ...d, logo: ev.target.result }));
    reader.readAsDataURL(file);
  }
  function saveWorkspaceSettings(e) {
    e.preventDefault();
    setWorkspaceName(workspaceDraft.name.trim() || "Norush Creative");
    setWorkspaceLogo(workspaceDraft.logo || LOGO_SRC);
    setWorkspaceSettingsOpen(false);
  }
  function openPreview(id) {
    setPreviewId(id);
    setLightbox(null);
    setMenuOpenId(null);
  }
  function openLightbox(images, index = 0) {
    if (!images || !images.length) return;
    setLightbox({ images, index });
  }
  function changeLightbox(delta) {
    setLightbox(lb => {
      if (!lb) return lb;
      return { ...lb, index: (lb.index + delta + lb.images.length) % lb.images.length };
    });
  }

  function addYear() {
    const next = years.length ? Math.max(...years) + 1 : new Date().getFullYear();
    setYears([...years, next]);
    setExpanded((e) => ({ ...e, [next]: true }));
    setFilter({ type: "year", year: next });
  }
  function toggleExpand(year) { setExpanded((e) => ({ ...e, [year]: !e[year] })); }
  function openNew(stage) { setEditingId(null); setForm({ ...emptyFormFor(filter), stage: stage || "inquiry" }); setModalOpen(true); }
  function openEdit(p) { setEditingId(p.id); setForm({ ...p, price: p.price || "", currency: p.currency || "IDR", images: p.images || [] }); setModalOpen(true); setMenuOpenId(null); }

  async function handleImageUpload(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    for (const file of files) {
      try {
        const dataUrl = await fileToResizedDataURL(file);
        setForm((f) => ({ ...f, images: [...(f.images || []), dataUrl] }));
      } catch (err) { /* skip file on error */ }
    }
  }
  function removeImage(idx) { setForm((f) => ({ ...f, images: f.images.filter((_, i) => i !== idx) })); }

  function saveForm(e) {
    e.preventDefault();
    if (!form.title.trim()) return;
    let yearNum = Number(form.year) || new Date().getFullYear();
    let monthNum = Number(form.month) || 1;
    if (form.due) {
      const d = new Date(form.due + "T00:00:00");
      yearNum = d.getFullYear();
      monthNum = d.getMonth() + 1;
    }
    const payload = { ...form, price: form.price === "" ? 0 : Number(form.price), year: yearNum, month: monthNum, id: editingId || uid() };
    if (editingId) setProjects(projects.map((p) => (p.id === editingId ? payload : p)));
    else setProjects([...projects, payload]);
    if (!years.includes(yearNum)) { setYears([...years, yearNum].sort((a,b)=>a-b)); setExpanded((e)=>({...e,[yearNum]:true})); }
    setModalOpen(false);
  }
  function deleteProject(id) { setProjects(projects.filter((p) => p.id !== id)); setMenuOpenId(null); }
  function moveProject(id, stage) { setProjects(projects.map((p) => (p.id === id ? { ...p, stage } : p))); }
  function resetBoard() { if (window.confirm("Hapus semua proyek dari papan ini? Tindakan ini tidak bisa dibatalkan.")) setProjects([]); }

  const displayedYears = Array.from(new Set([...years, ...projects.map((p) => p.year)])).sort((a, b) => b - a);
  const countYear = (year) => projects.filter((p) => p.year === year).length;
  const countMonth = (year, month) => projects.filter((p) => p.year === year && p.month === month).length;
  const workspaceFiltered = projects.filter((p) => {
    if (filter.type === "all") return true;
    if (filter.type === "year") return p.year === filter.year;
    if (filter.type === "month") return p.year === filter.year && p.month === filter.month;
    return true;
  });
  const filtered = workspaceFiltered.filter((p) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return (p.title + " " + p.client).toLowerCase().includes(q);
  });
  const filterLabel = filter.type === "all" ? "Semua proyek" : filter.type === "year" ? `Tahun ${filter.year}` : `${MONTHS_ID[filter.month - 1]} ${filter.year}`;

  return (
    <div className="board-root">
      <div className="app-layout">
        <aside className="sidebar">
          <div className="workspace-switcher">
            <span className="workspace-avatar">N</span>
            <span>Norush Creative</span>
            <span className="workspace-chevron">⌄</span>
          </div>
          <div className="quick-nav">
            <button className="quick-link"><span className="nav-icon">⌕</span>Pencarian</button>
            <button className="quick-link"><span className="nav-icon">◷</span>Pembaruan</button>
            <button className="quick-link"><span className="nav-icon">▣</span>Arsip</button>
          </div>
          <div className="side-section-label">Ruang kerja</div>
          <button className={"side-all" + (filter.type === "all" ? " active" : "")} onClick={() => setFilter({ type: "all" })}><span className="nav-icon">▤</span>Semua Proyek</button>
          {displayedYears.map((year) => (
            <div className="year-block" key={year}>
              <div className="year-head">
                <button className="year-toggle" onClick={() => toggleExpand(year)}>{expanded[year] ? "▾" : "▸"}</button>
                <button className={"year-label" + (filter.type === "year" && filter.year === year ? " active" : "")} onClick={() => setFilter({ type: "year", year })}>{year}</button>
                <span className="year-count">{countYear(year)}</span>
              </div>
              {expanded[year] && (
                <div className="month-list">
                  {MONTHS_ID.map((m, idx) => {
                    const monthNum = idx + 1;
                    const c = countMonth(year, monthNum);
                    return (
                      <button key={m} className={"month-item" + (filter.type === "month" && filter.year === year && filter.month === monthNum ? " active" : "")} onClick={() => setFilter({ type: "month", year, month: monthNum })}>
                        <span>{m}</span><span className="month-count">{c || ""}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          ))}
          <button className="add-year-btn" onClick={addYear}>+ Tahun Baru</button>
          <div className="sidebar-footer">Papan proyek pribadi<br />Tersimpan di perangkat ini</div>
        </aside>

        <main className="board-main">
          <div className="page-bar">
            <div className="breadcrumb"><span className="crumb-icon">{workspaceLogo ? <img src={workspaceLogo} alt="" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:"4px"}} /> : workspaceName.slice(0,1).toUpperCase()}</span><span>{workspaceName}</span><span>/</span><span>Proyek</span></div>
            <div className="page-actions">
              <button className="page-action">Bagikan</button>
              <button className="page-action">Favorit</button>
              <button className="page-action">•••</button>
            </div>
          </div>
          <div className="content-wrap">
            <div className="page-icon">{workspaceLogo ? <img src={workspaceLogo} alt="" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:"13px"}} /> : workspaceName.slice(0,1).toUpperCase()}</div>
            <div className="topbar">
              <div className="brand-mark">
                <img className="brand-logo" src={LOGO_SRC} alt="" />
                <div>
                  <h1 className="brand-title">{workspaceName}</h1>
                  <p className="brand-sub">Workspace · Kelola seluruh pekerjaan dalam satu ruang.</p>
                </div>
              </div>
              <div className="top-actions">
                <div className="search-wrap"><input className="search-input" aria-label="Cari proyek" placeholder="Cari proyek…" value={query} onChange={(e) => setQuery(e.target.value)} /></div>
                <button className="btn-primary" onClick={() => openNew()}>+ Proyek Baru</button>
              </div>
            </div>

            <div className="database-toolbar">
              <div className="view-tabs">
                <button className="view-tab active">▥ Papan</button>
                <button className="view-tab">≡ Daftar</button>
              </div>
              <div className="toolbar-meta">{filterLabel} · {filtered.length} proyek</div>
            </div>

            {!storageOk && <div className="warn-banner">Penyimpanan browser sedang bermasalah — perubahan mungkin tidak tersimpan permanen.</div>}

            <div className="columns">
              {STAGES.map((stage) => {
                const items = filtered.filter((p) => p.stage === stage.id);
                return (
                  <div className="column" key={stage.id}>
                    <div className="col-head"><span className="col-title">{stage.label}</span><span className="col-count">{items.length}</span></div>
                    <div className="col-drop" onDragOver={(e) => e.preventDefault()} onDrop={() => { if (draggedId) moveProject(draggedId, stage.id); setDraggedId(null); }}>
                      {items.length === 0 && <div className="empty-col">Belum ada proyek di sini.</div>}
                      {items.map((p) => {
                        const wt = workType(p.type);
                        const badge = dueBadge(p.due);
                        return (
                          <div key={p.id} className="card" draggable onDragStart={() => setDraggedId(p.id)} onClick={() => openPreview(p.id)}>
                            <div className="card-top">
                              <div>
                                <p className="card-title">{p.title}</p>
                                <p className="card-client">{p.client || "Tanpa nama klien"}</p>
                              </div>
                              <button className="menu-btn" aria-label="Menu proyek" onClick={(e) => { e.stopPropagation(); setMenuOpenId(menuOpenId === p.id ? null : p.id); }}>⋯</button>
                            </div>
                            {menuOpenId === p.id && (
                              <div className="menu-pop" ref={menuRef} onClick={(e) => e.stopPropagation()}>
                                <button className="menu-item" onClick={() => openEdit(p)}>Edit</button>
                                <button className="menu-item danger" onClick={() => deleteProject(p.id)}>Hapus proyek</button>
                              </div>
                            )}
                            <div className="tag-row">
                              <span className="tag" style={{ background: wt.color }}>{wt.label}</span>
                              <span className="tag tag-source">{p.source}</span>
                            </div>
                            <div className="card-meta">
                              <span>{formatPrice(p)}</span>
                              {badge && <span className={`due-badge due-${badge.tone}`}>{badge.text}</span>}
                            </div>
                            {p.images && p.images.length > 0 && (
                              <div className="card-images" onClick={(e) => e.stopPropagation()}>
                                {p.images.slice(0, 3).map((src, i) => (
                                  <img key={i} src={src} className="card-thumb" alt="Referensi proyek"
                                    onClick={() => openLightbox(p.images, i)} />
                                ))}
                                {p.images.length > 3 && <span className="card-thumb-more">+{p.images.length - 3}</span>}
                              </div>
                            )}
                            <button className="card-preview-btn" onClick={(e) => { e.stopPropagation(); openPreview(p.id); }}>Lihat full preview ↗</button>
                          </div>
                        );
                      })}
                      <button className="col-add" onClick={() => openNew(stage.id)}>+ Tambah proyek</button>
                    </div>
                  </div>
                );
              })}
            </div>
            <button className="btn-ghost" onClick={resetBoard}>Reset papan</button>
          </div>
        </main>
      </div>

      {previewId && (() => {
        const p = projects.find(x => x.id === previewId);
        if (!p) return null;
        const wt = workType(p.type);
        const badge = dueBadge(p.due);
        return (
          <div className="preview-modal-overlay" onClick={() => setPreviewId(null)}>
            <section className="preview-modal" onClick={(e) => e.stopPropagation()}>
              <div className="preview-head">
                <div>
                  <div className="preview-kicker">{wt.label} · {STAGES.find(s => s.id === p.stage)?.label || p.stage}</div>
                  <h2 className="preview-title">{p.title}</h2>
                  <p className="preview-client">{p.client || "Tanpa nama klien"}</p>
                </div>
                <div style={{display:"flex",gap:"7px"}}>
                  <button className="btn-secondary" onClick={() => { setPreviewId(null); openEdit(p); }}>Edit</button>
                  <button className="preview-close" onClick={() => setPreviewId(null)} aria-label="Tutup">×</button>
                </div>
              </div>
              <div className="preview-body">
                <div className="preview-info">
                  <div className="preview-info-item"><span className="preview-info-label">Klien</span><span className="preview-info-value">{p.client || "—"}</span></div>
                  <div className="preview-info-item"><span className="preview-info-label">Sumber</span><span className="preview-info-value">{p.source || "—"}</span></div>
                  <div className="preview-info-item"><span className="preview-info-label">Nilai</span><span className="preview-info-value">{formatPrice(p)}</span></div>
                  <div className="preview-info-item"><span className="preview-info-label">Deadline</span><span className="preview-info-value">{badge ? badge.text : "—"}</span></div>
                </div>
                {p.images && p.images.length ? (
                  <div className="preview-gallery">
                    {p.images.map((src, i) => (
                      <img key={i} className="preview-image" src={src} alt={"Referensi " + (i + 1)}
                        onClick={() => openLightbox(p.images, i)} title="Klik untuk memperbesar" />
                    ))}
                  </div>
                ) : <div className="preview-empty">Belum ada attachment gambar untuk proyek ini.</div>}
              </div>
            </section>
          </div>
        );
      })()}

      {workspaceSettingsOpen && (
        <div className="modal-overlay" onClick={() => setWorkspaceSettingsOpen(false)}>
          <form className="modal settings-modal" onClick={(e) => e.stopPropagation()} onSubmit={saveWorkspaceSettings}>
            <h2>Identitas Workspace</h2>
            <div className="field">
              <label>Nama Workspace</label>
              <input autoFocus value={workspaceDraft.name} onChange={(e) => setWorkspaceDraft({...workspaceDraft, name:e.target.value})} placeholder="Nama workspace" />
            </div>
            <div className="field">
              <label>Logo Workspace</label>
              <div className="logo-upload">
                <img className="logo-preview" src={workspaceDraft.logo || LOGO_SRC} alt="" />
                <div className="logo-upload-copy"><strong>Ganti logo</strong>PNG, JPG, atau WEBP. Logo disimpan di browser perangkat ini.</div>
                <label className="btn-secondary" style={{cursor:"pointer"}}>
                  Pilih
                  <input type="file" accept="image/*" onChange={handleWorkspaceLogo} style={{display:"none"}} />
                </label>
              </div>
            </div>
            <div className="modal-actions">
              <div></div>
              <div className="modal-actions-right">
                <button type="button" className="btn-secondary" onClick={() => setWorkspaceSettingsOpen(false)}>Batal</button>
                <button type="submit" className="btn-primary">Simpan</button>
              </div>
            </div>
          </form>
        </div>
      )}

      {lightbox && (
        <div className="lightbox-overlay" onClick={() => setLightbox(null)}>
          <button className="lightbox-close" onClick={() => setLightbox(null)} aria-label="Tutup">×</button>
          {lightbox.images.length > 1 && <button className="lightbox-nav lightbox-prev" onClick={(e) => {e.stopPropagation(); changeLightbox(-1);}}>‹</button>}
          <img className="lightbox-image" src={lightbox.images[lightbox.index]} alt="Preview attachment"
            onClick={(e) => e.stopPropagation()} />
          {lightbox.images.length > 1 && <button className="lightbox-nav lightbox-next" onClick={(e) => {e.stopPropagation(); changeLightbox(1);}}>›</button>}
        </div>
      )}

      {modalOpen && (
        <div className="modal-overlay" onClick={() => setModalOpen(false)}>
          <form className="modal" onClick={(e) => e.stopPropagation()} onSubmit={saveForm}>
            <h2>{editingId ? "Edit Proyek" : "Proyek Baru"}</h2>
            <div className="field">
              <label>Nama Proyek</label>
              <input autoFocus value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="mis. Wordmark — Toko Kopi Senja" required />
            </div>
            <div className="field-row">
              <div className="field"><label>Nama Klien</label><input value={form.client} onChange={(e) => setForm({ ...form, client: e.target.value })} /></div>
              <div className="field"><label>Sumber Klien</label>
                <select value={form.source} onChange={(e) => setForm({ ...form, source: e.target.value })}>
                  {SOURCES.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>
            <div className="field-row">
              <div className="field"><label>Jenis Pekerjaan</label>
                <select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
                  {WORK_TYPES.map((w) => <option key={w.id} value={w.id}>{w.label}</option>)}
                </select>
              </div>
              <div className="field"><label>Tahap</label>
                <select value={form.stage} onChange={(e) => setForm({ ...form, stage: e.target.value })}>
                  {STAGES.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
              </div>
            </div>
            <div className="field">
              <label>Deadline</label>
              <input type="date" value={form.due} onChange={(e) => setForm({ ...form, due: e.target.value })} />
            </div>
            <div className="field-row">
              <div className="field"><label>Harga</label><input type="number" min="0" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} /></div>
              <div className="field"><label>Mata Uang</label>
                <select value={form.currency} onChange={(e) => setForm({ ...form, currency: e.target.value })}>
                  {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </div>
            <div className="field">
              <label>Referensi Gambar</label>
              <input type="file" accept="image/*" multiple onChange={handleImageUpload} />
              {form.images && form.images.length > 0 && (
                <div className="img-grid">
                  {form.images.map((src, idx) => (
                    <div className="img-thumb-wrap" key={idx}>
                      <img src={src} alt="" onClick={() => openLightbox(form.images, idx)} />
                      <button type="button" className="img-remove" onClick={() => removeImage(idx)}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className="modal-actions">
              <div>{editingId && <button type="button" className="btn-ghost" onClick={() => deleteProject(editingId)}>Hapus proyek</button>}</div>
              <div className="modal-actions-right">
                <button type="button" className="btn-secondary" onClick={() => setModalOpen(false)}>Batal</button>
                <button type="submit" className="btn-primary">Simpan</button>
              </div>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ProjectBoard />);
</script>
</body>
</html>
