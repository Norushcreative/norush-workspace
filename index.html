<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Norush Creative — Papan Proyek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  button, input, select { font: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #b98a60; outline-offset: 2px; }
  .board-root {

  }
  .app-layout { display: flex; align-items: flex-start; min-height: 100vh; }

  .workspace-chevron { margin-left: auto; color: var(--muted); font-size: 11px; }

  .year-label:hover, .month-item:hover { background: var(--hover); color: var(--ink); }

  .month-item { display: flex; justify-content: space-between; width: 100%; background: none; border: none; font-size: 12px; color: #777570; padding: 5px 7px; border-radius: 5px; cursor: pointer; text-align: left; }
  .add-year-btn { margin-top: 5px; color: #8a8883; }
  .sidebar-footer { margin: 20px 8px 0; padding-top: 12px; border-top: 1px solid #e4e0da; color: #9a9893; font-size: 11px; line-height: 1.5; }
  .board-main { flex: 1; min-width: 0; padding: 0 0 60px; }

  .breadcrumb { display: flex; align-items: center; gap: 7px; color: var(--muted); }
  .crumb-icon { display: none; overflow: hidden; width: 20px; height: 20px; border-radius: 4px; background: #2f2e2a; color: #fff; display: grid; place-items: center; font-family: 'Newsreader', serif; }
  .page-actions { display: flex; align-items: center; gap: 4px; }

  .content-wrap { padding: 48px 42px 0; max-width: 1540px; margin: 0 auto; }
  .page-icon { overflow: hidden; width: 58px; height: 58px; border-radius: 13px; background: #efe4d9; color: #8c5f3e; display: grid; place-items: center; font-family: 'Newsreader', serif; font-size: 31px; margin-bottom: 17px; transform: rotate(-2deg); }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 25px; }
  .brand-mark { display: flex; align-items: center; gap: 12px; }
  .brand-logo { display: none; }

  .brand-sub { margin: 9px 0 0; font-size: 13px; color: var(--muted); }
  .top-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }

  .search-input { font-size: 12px; padding: 7px 10px 7px 29px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 6px; width: 190px; box-shadow: 0 1px 1px rgba(55,53,47,.03); }
  .btn-primary { font-weight: 600; font-size: 12px; background: #2f2e2a; color: #fff; border: 1px solid #2f2e2a; padding: 7px 11px; border-radius: 6px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .btn-primary:hover { background: #484640; transform: translateY(-1px); }

  .database-toolbar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 16px; min-width: 0; }

  .toolbar-meta { color: #9a9893; font-size: 11px; padding-right: 3px; }

  .columns { display: flex; gap: 11px; overflow-x: auto; padding: 1px 2px 22px; align-items: flex-start; scrollbar-color: #d8d4cd transparent; }

  .col-add:hover { background: var(--hover); color: var(--ink); }

  .card { position: relative; background: var(--card); border: 1px solid #e5e2dc; border-radius: 7px; padding: 11px 11px 10px; margin-bottom: 7px; cursor: grab; box-shadow: 0 1px 2px rgba(55,53,47,.06); transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; animation: cardIn .35s ease both; }
  .card:hover { transform: translateY(-2px); border-color: #d8d4cd; box-shadow: 0 5px 16px rgba(55,53,47,.09); }
  .card:active { cursor: grabbing; transform: rotate(1deg) scale(.99); }
  .card-top { display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; }
  .card-title { font-family: 'Newsreader', serif; font-weight: 600; font-size: 15px; margin: 0 0 4px; line-height: 1.25; letter-spacing: -.01em; }
  .card-client { font-size: 11px; color: var(--muted); margin: 0 0 9px; }
  .tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .tag { font-size: 9.5px; padding: 2px 6px; border-radius: 4px; color: #fff; white-space: nowrap; opacity: .87; }
  .tag-source { background: #f0efec; color: #75736e; }
  .card-meta { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid #f0eeea; font-size: 10.5px; color: var(--muted); }
  .due-badge { padding: 2px 5px; border-radius: 4px; font-weight: 600; }

  .card-thumb { width: 35px; height: 35px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
  .card-thumb-more { font-size: 10px; color: var(--muted); }
  .menu-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 3px; line-height: 1; border-radius: 4px; }
  .menu-btn:hover { background: var(--hover); }
  .menu-pop { position: absolute; top: 28px; right: 7px; background: #fff; border: 1px solid var(--line); border-radius: 7px; z-index: 5; overflow: hidden; min-width: 132px; padding: 4px; box-shadow: 0 8px 28px rgba(55,53,47,.16); }
  .menu-item { display: block; width: 100%; text-align: left; padding: 7px 9px; font-size: 12px; background: none; border: none; cursor: pointer; color: var(--ink); border-radius: 4px; }
  .menu-item:hover { background: #f3f1ed; }
  .menu-item.danger { color: #b3524b; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(38,36,32,.42); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; animation: fadeIn .18s ease; }
  .modal { background: var(--paper); border: 1px solid var(--line); border-radius: 11px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; padding: 24px; box-shadow: 0 24px 70px rgba(38,36,32,.22); animation: modalIn .22s ease; }
  .modal h2 { font-family: 'Newsreader', serif; font-size: 25px; margin: 0 0 19px; letter-spacing: -.02em; }
  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .field input, .field select { width: 100%; font-size: 12px; padding: 8px 9px; border: 1px solid #dedbd5; border-radius: 6px; background: #fff; color: var(--ink); }
  .field input:hover, .field select:hover { border-color: #cac6be; }
  .field-row { display: flex; gap: 10px; }
  .field-row > div { flex: 1; }
  .img-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .img-thumb-wrap { position: relative; width: 64px; height: 64px; }
  .img-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
  .img-remove { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--paper); border: none; cursor: pointer; font-size: 10px; line-height: 1; }
  .modal-actions { display: flex; justify-content: space-between; margin-top: 20px; align-items: center; }
  .modal-actions-right { display: flex; gap: 8px; }
  .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }

  .workspace-avatar.has-logo { background: #fff; overflow: hidden; }
  .workspace-avatar.has-logo img { width: 100%; height: 100%; object-fit: cover; }
  .workspace-switcher { cursor: pointer; }
  .workspace-switcher:hover { background: var(--hover); border-radius: 6px; }
  .editable-hint { font-size: 10px; color: #aaa7a1; margin-left: 4px; opacity: 0; transition: opacity .15s; }
  .workspace-switcher:hover .editable-hint { opacity: 1; }
  .preview-modal-overlay { position: fixed; inset: 0; background: rgba(28,27,24,.56); backdrop-filter: blur(6px); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn .18s ease; }
  .preview-modal { width: min(980px, 100%); max-height: 92vh; overflow-y: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 28px 90px rgba(0,0,0,.28); animation: modalIn .22s ease; }
  .preview-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding: 22px 25px; background: rgba(251,250,248,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .preview-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin-bottom: 5px; }
  .preview-title { font-family: 'Newsreader', serif; font-size: 30px; line-height: 1.1; margin: 0 0 5px; letter-spacing: -.025em; }
  .preview-client { color: var(--muted); font-size: 12px; margin: 0; }
  .preview-close { border: 1px solid var(--line); background: #fff; color: var(--ink); width: 32px; height: 32px; border-radius: 7px; cursor: pointer; font-size: 16px; }
  .preview-close:hover { background: var(--hover); }
  .preview-body { padding: 25px; }
  .preview-info { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; margin-bottom: 24px; }
  .preview-info-item { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; }
  .preview-info-label { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: #9a9893; margin-bottom: 4px; font-weight: 600; }
  .preview-info-value { font-size: 12px; color: var(--ink); font-weight: 500; }
  .preview-gallery { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .preview-image { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #f0eeea; border: 1px solid var(--line); border-radius: 9px; cursor: zoom-in; transition: transform .15s, box-shadow .15s; }
  .preview-image:hover { transform: translateY(-1px); box-shadow: 0 7px 20px rgba(55,53,47,.10); }
  .preview-empty { padding: 35px 15px; text-align: center; color: #aaa7a1; font-size: 12px; border: 1px dashed var(--line); border-radius: 9px; }
  .lightbox-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,19,17,.88); display: flex; align-items: center; justify-content: center; padding: 25px; animation: fadeIn .15s ease; }
  .lightbox-image { max-width: 94vw; max-height: 88vh; object-fit: contain; border-radius: 5px; box-shadow: 0 20px 80px rgba(0,0,0,.35); cursor: zoom-out; }
  .lightbox-close { position: fixed; top: 17px; right: 19px; width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.25); color: #fff; border-radius: 50%; cursor: pointer; font-size: 19px; }
  .lightbox-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.25); color: #fff; border-radius: 50%; cursor: pointer; font-size: 20px; }
  .lightbox-prev { left: 18px; }
  .lightbox-next { right: 18px; }
  .settings-modal { max-width: 480px; }
  .logo-upload { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px dashed #d7d3cc; border-radius: 8px; background: #fff; }
  .logo-preview { width: 54px; height: 54px; border-radius: 11px; object-fit: cover; border: 1px solid var(--line); background: #2f2e2a; }
  .logo-upload-copy { flex: 1; font-size: 11px; color: var(--muted); line-height: 1.45; }
  .logo-upload-copy strong { display: block; color: var(--ink); margin-bottom: 2px; }
  .card-preview-btn { margin-top: 8px; width: 100%; text-align: center; border: 1px solid var(--line); background: #faf9f7; color: #6b6964; border-radius: 5px; padding: 5px; font-size: 10px; cursor: pointer; }

    .preview-head { padding: 17px; }
  }


  .todo-section { margin: 0 0 24px; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; box-shadow: 0 1px 2px rgba(55,53,47,.03); }
  .todo-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-bottom: 1px solid #eeeae5; }
  .todo-title-wrap { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .todo-title { font-size: 11px; color: var(--ink); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
  .todo-month-label { font-size: 11px; color: var(--muted); }
  .todo-month-nav { display: flex; gap: 3px; }
  .todo-month { width: 27px; height: 27px; border: 1px solid var(--line); background: #fff; color: #777570; font-size: 14px; cursor: pointer; border-radius: 5px; }
  .todo-month:hover { background: var(--hover); color: var(--ink); }
  .todo-list { display: flex; flex-direction: column; }
  .todo-item { display: flex; align-items: flex-start; gap: 9px; padding: 10px 15px; border-bottom: 1px solid #f0eeea; }
  .todo-item:hover { background: #fcfbf9; }
  .todo-check { appearance: none; width: 16px; height: 16px; flex: 0 0 16px; border: 1px solid #c5c1b9; border-radius: 4px; background: #fff; margin: 1px 0 0; cursor: pointer; position: relative; }
  .todo-check:checked { background: #2f2e2a; border-color: #2f2e2a; }
  .todo-check:checked::after { content: '✓'; color: #fff; font-size: 11px; position: absolute; left: 2px; top: -1px; }

  .todo-item.done .todo-text { color: #aaa7a1; text-decoration: line-through; }
  .todo-delete { border: none; background: none; color: #aaa7a1; cursor: pointer; font-size: 14px; line-height: 1; opacity: 0; padding: 0 2px; }
  .todo-item:hover .todo-delete { opacity: 1; }
  .todo-add { width: 100%; border: none; background: none; color: #999690; text-align: left; font-size: 12px; padding: 10px 15px; cursor: pointer; }
  .todo-add:hover { background: #f8f7f4; color: var(--ink); }

  .todo-add-input { min-width: 0; flex: 1; border: 1px solid #dedbd5; border-radius: 6px; padding: 7px 8px; font-size: 12px; background: #fff; color: var(--ink); }
  .todo-add-save { border: 1px solid #2f2e2a; background: #2f2e2a; color: #fff; border-radius: 6px; font-size: 11px; padding: 6px 10px; cursor: pointer; }
  .todo-empty { padding: 14px 15px; color: #aaa7a1; font-size: 11px; border-bottom: 1px solid #f0eeea; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(5px); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(.985); } }
  @media (max-width: 800px) {
    .app-layout { flex-direction: column; }
    .sidebar { flex: none; width: 100%; min-height: unset; max-height: none; position: static; border-right: none; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
    .quick-nav, .side-section-label, .sidebar-footer { display: none; }
    .workspace-switcher { padding-bottom: 4px; }
    .side-all { margin-top: 4px; }
    .year-block { display: inline-block; width: calc(50% - 3px); vertical-align: top; }
    .month-list { max-height: 132px; overflow-y: auto; }
    .add-year-btn { width: auto; }
    .content-wrap { padding: 32px 18px 0; }
    .page-bar { top: 0; }
    .top-actions { width: 100%; }

    .search-input { width: 100%; }
  }

    .brand-title { font-size: 35px; }
    .field-row { flex-direction: column; gap: 0; }
    .modal { padding: 19px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

function fileToResizedDataURL(file, maxDim = 1000, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dueBadge(due) {
  if (!due) return null;
  const d = new Date(due + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff < 0) return { text: `Lewat ${Math.abs(diff)} hari`, tone: "late" };
  if (diff === 0) return { text: "Hari ini", tone: "today" };
  if (diff <= 3) return { text: `H-${diff}`, tone: "soon" };
  return { text: d.toLocaleDateString("id-ID", { day: "numeric", month: "short" }), tone: "normal" };
}

function formatPrice(p) {
  if (!p.price) return "—";
  if (p.currency === "USD") return `$${Number(p.price).toLocaleString("en-US")}`;
  return `Rp${Number(p.price).toLocaleString("id-ID")}`;
}

function loadLS(key, fallback) {

              <div className="top-actions">
                <div className="search-wrap"><input className="search-input" aria-label="Cari proyek" placeholder="Cari proyek…" value={query} onChange={(e) => setQuery(e.target.value)} /></div>
                <button className="btn-primary" onClick={() => openNew()}>+ Proyek Baru</button>
              </div>
            </div>

            <div className="todo-section">
              <div className="todo-head">
                <div className="todo-title-wrap">
                  <span className="todo-title">To Do Bulanan</span>
                  <span className="todo-month-label">
                    {(() => { const [y,m] = todoMonth.split("-").map(Number); return "— " + MONTHS_ID[m - 1] + " " + y; })()}
                  </span>
                </div>
                <div className="todo-month-nav">
                  <button type="button" className="todo-month" onClick={() => shiftTodoMonth(-1)} aria-label="Bulan sebelumnya">‹</button>
                  <button type="button" className="todo-month" onClick={() => shiftTodoMonth(1)} aria-label="Bulan berikutnya">›</button>
                </div>
              </div>

              {todoItemsForMonth(todoMonth).length === 0 && (
                <div className="todo-empty">Belum ada tugas untuk bulan ini.</div>
              )}

              <div className="todo-list">
                {todoItemsForMonth(todoMonth).map((todo) => (
                  <div className={"todo-item" + (todo.done ? " done" : "")} key={todo.id}>
                    <input className="todo-check" type="checkbox" checked={!!todo.done}
                      onChange={() => toggleTodo(todo.id)} aria-label={"Tandai selesai: " + todo.text} />
                    <span className="todo-text" onClick={() => toggleTodo(todo.id)}>{todo.text}</span>
                    <button className="todo-delete" onClick={() => deleteTodo(todo.id)} aria-label="Hapus tugas">×</button>
                  </div>
                ))}
              </div>

              {todoAdding ? (
                <form className="todo-add-form" onSubmit={addTodo}>
                  <input className="todo-add-input" autoFocus value={todoDraft}
                    onChange={(e) => setTodoDraft(e.target.value)} placeholder="Tulis tugas baru…"
                    onKeyDown={(e) => { if (e.key === "Escape") { setTodoAdding(false); setTodoDraft(""); } }} />
                  <button className="todo-add-save" type="submit">Tambah</button>
                </form>
              ) : (
                <button className="todo-add" onClick={() => setTodoAdding(true)}>+ Tambah tugas</button>
              )}
            </div>

            <div className="database-toolbar">
              <div className="view-tabs">
                <button className="view-tab active">▥ Papan</button>
                <button className="view-tab">≡ Daftar</button>
              </div>
              <div className="toolbar-meta">{filterLabel} · {filtered.length} proyek</div>
            </div>

            {!storageOk && <div className="warn-banner">Penyimpanan browser sedang bermasalah — perubahan mungkin tidak tersimpan permanen.</div>}

            <div className="columns">
              {STAGES.map((stage) => {
                const items = filtered.filter((p) => p.stage === stage.id);
                return (
                  <div className="column" key={stage.id}>
                    <div className="col-head"><span className="col-title">{stage.label}</span><span className="col-count">{items.length}</span></div>
                    <div className="col-drop" onDragOver={(e) => e.preventDefault()} onDrop={() => { if (draggedId) moveProject(draggedId, stage.id); setDraggedId(null); }}>
                      {items.length === 0 && <div className="empty-col">Belum ada proyek di sini.</div>}
                      {items.map((p) => {
                        const wt = workType(p.type);
                        const badge = dueBadge(p.due);
                        return (
                          <div key={p.id} className="card" draggable onDragStart={() => setDraggedId(p.id)} onClick={() => openPreview(p.id)}>
                            <div className="card-top">
                              <div>
                                <p className="card-title">{p.title}</p>
                                <p className="card-client">{p.client || "Tanpa nama klien"}</p>
                              </div>
                              <button className="menu-btn" aria-label="Menu proyek" onClick={(e) => { e.stopPropagation(); setMenuOpenId(menuOpenId === p.id ? null : p.id); }}>⋯</button>
                            </div>
                            {menuOpenId === p.id && (
                              <div className="menu-pop" ref={menuRef} onClick={(e) => e.stopPropagation()}>
                                <button className="menu-item" onClick={() => openEdit(p)}>Edit</button>
                                <button className="menu-item danger" onClick={() => deleteProject(p.id)}>Hapus proyek</button>
                              </div>
                            )}
                            <div className="tag-row">
                              <span className="tag" style={{ background: wt.color }}>{wt.label}</span>
                              <span className="tag tag-source">{p.source}</span>
                            </div>
                            <div className="card-meta">
                              <span>{formatPrice(p)}</span>
                              {badge && <span className={`due-badge due-${badge.tone}`}>{badge.text}</span>}
                            </div>
                            {p.images && p.images.length > 0 && (
                              <div className="card-images" onClick={(e) => e.stopPropagation()}>
                                {p.images.slice(0, 3).map((src, i) => (
                                  <img key={i} src={src} className="card-thumb" alt="Referensi proyek"
                                    onClick={() => openLightbox(p.images, i)} />
                                ))}
                                {p.images.length > 3 && <span className="card-thumb-more">+{p.images.length - 3}</span>}
                              </div>
                            )}
                            <button className="card-preview-btn" onClick={(e) => { e.stopPropagation(); openPreview(p.id); }}>Lihat full preview ↗</button>
                          </div>
                        );
                      })}
                      <button className="col-add" onClick={() => openNew(stage.id)}>+ Tambah proyek</button>
                    </div>
                  </div>
                );
              })}
            </div>
            <button className="btn-ghost" onClick={resetBoard}>Reset papan</button>
          </div>
        </main>
      </div>

      {previewId && (() => {
        const p = projects.find(x => x.id === previewId);
        if (!p) return null;
        const wt = workType(p.type);
        const badge = dueBadge(p.due);
        return (
          <div className="preview-modal-overlay" onClick={() => setPreviewId(null)}>
            <section className="preview-modal" onClick={(e) => e.stopPropagation()}>
              <div className="preview-head">
                <div>
                  <div className="preview-kicker">{wt.label} · {STAGES.find(s => s.id === p.stage)?.label || p.stage}</div>
                  <h2 className="preview-title">{p.title}</h2>
                  <p className="preview-client">{p.client || "Tanpa nama klien"}</p>
                </div>
                <div style={{display:"flex",gap:"7px"}}>
                  <button className="btn-secondary" onClick={() => { setPreviewId(null); openEdit(p); }}>Edit</button>
                  <button className="preview-close" onClick={() => setPreviewId(null)} aria-label="Tutup">×</button>
                </div>
              </div>
              <div className="preview-body">
                <div className="preview-info">
                  <div className="preview-info-item"><span className="preview-info-label">Klien</span><span className="preview-info-value">{p.client || "—"}</span></div>
                  <div className="preview-info-item"><span className="preview-info-label">Sumber</span><span className="preview-info-value">{p.source || "—"}</span></div>
                  <div className="preview-info-item"><span className="preview-info-label">Nilai</span><span className="preview-info-value">{formatPrice(p)}</span></div>
                  <div className="preview-info-item"><span className="preview-info-label">Deadline</span><span className="preview-info-value">{badge ? badge.text : "—"}</span></div>
                </div>
                {p.images && p.images.length ? (
                  <div className="preview-gallery">
                    {p.images.map((src, i) => (
                      <img key={i} className="preview-image" src={src} alt={"Referensi " + (i + 1)}
                        onClick={() => openLightbox(p.images, i)} title="Klik untuk memperbesar" />
                    ))}
                  </div>
                ) : <div className="preview-empty">Belum ada attachment gambar untuk proyek ini.</div>}
              </div>
            </section>
          </div>
        );
      })()}

      {workspaceSettingsOpen && (
        <div className="modal-overlay" onClick={() => setWorkspaceSettingsOpen(false)}>
          <form className="modal settings-modal" onClick={(e) => e.stopPropagation()} onSubmit={saveWorkspaceSettings}>
            <h2>Identitas Workspace</h2>
            <div className="field">
              <label>Nama Workspace</label>
              <input autoFocus value={workspaceDraft.name} onChange={(e) => setWorkspaceDraft({...workspaceDraft, name:e.target.value})} placeholder="Nama workspace" />
            </div>
            <div className="field">
              <label>Logo Workspace</label>
              <div className="logo-upload">
                <img className="logo-preview" src={workspaceDraft.logo || LOGO_SRC} alt="" />
                <div className="logo-upload-copy"><strong>Ganti logo</strong>PNG, JPG, atau WEBP. Logo disimpan di browser perangkat ini.</div>
                <label className="btn-secondary" style={{cursor:"pointer"}}>
                  Pilih
                  <input type="file" accept="image/*" onChange={handleWorkspaceLogo} style={{display:"none"}} />
                </label>
              </div>
            </div>
            <div className="modal-actions">
              <div></div>
              <div className="modal-actions-right">
                <button type="button" className="btn-secondary" onClick={() => setWorkspaceSettingsOpen(false)}>Batal</button>
                <button type="submit" className="btn-primary">Simpan</button>
              </div>
            </div>
          </form>
        </div>
      )}

      {lightbox && (
        <div className="lightbox-overlay" onClick={() => setLightbox(null)}>
          <button className="lightbox-close" onClick={() => setLightbox(null)} aria-label="Tutup">×</button>
          {lightbox.images.length > 1 && <button className="lightbox-nav lightbox-prev" onClick={(e) => {e.stopPropagation(); changeLightbox(-1);}}>‹</button>}
          <img className="lightbox-image" src={lightbox.images[lightbox.index]} alt="Preview attachment"
            onClick={(e) => e.stopPropagation()} />
          {lightbox.images.length > 1 && <button className="lightbox-nav lightbox-next" onClick={(e) => {e.stopPropagation(); changeLightbox(1);}}>›</button>}
        </div>
      )}

      {modalOpen && (
        <div className="modal-overlay" onClick={() => setModalOpen(false)}>
          <form className="modal" onClick={(e) => e.stopPropagation()} onSubmit={saveForm}>
            <h2>{editingId ? "Edit Proyek" : "Proyek Baru"}</h2>
            <div className="field">
              <label>Nama Proyek</label>
              <input autoFocus value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="mis. Wordmark — Toko Kopi Senja" required />
            </div>
            <div className="field-row">
              <div className="field"><label>Nama Klien</label><input value={form.client} onChange={(e) => setForm({ ...form, client: e.target.value })} /></div>
              <div className="field"><label>Sumber Klien</label>
                <select value={form.source} onChange={(e) => setForm({ ...form, source: e.target.value })}>
                  {SOURCES.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            </div>
            <div className="field-row">
              <div className="field"><label>Jenis Pekerjaan</label>
                <select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
                  {WORK_TYPES.map((w) => <option key={w.id} value={w.id}>{w.label}</option>)}
                </select>
              </div>
              <div className="field"><label>Tahap</label>
                <select value={form.stage} onChange={(e) => setForm({ ...form, stage: e.target.value })}>
                  {STAGES.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
              </div>
            </div>
            <div className="field">
              <label>Deadline</label>
              <input type="date" value={form.due} onChange={(e) => setForm({ ...form, due: e.target.value })} />
            </div>
            <div className="field-row">
              <div className="field"><label>Harga</label><input type="number" min="0" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} /></div>
              <div className="field"><label>Mata Uang</label>
                <select value={form.currency} onChange={(e) => setForm({ ...form, currency: e.target.value })}>
                  {CURRENCIES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </div>
            <div className="field">
              <label>Referensi Gambar</label>
              <input type="file" accept="image/*" multiple onChange={handleImageUpload} />
              {form.images && form.images.length > 0 && (
                <div className="img-grid">
                  {form.images.map((src, idx) => (
                    <div className="img-thumb-wrap" key={idx}>
                      <img src={src} alt="" onClick={() => openLightbox(form.images, idx)} />
                      <button type="button" className="img-remove" onClick={() => removeImage(idx)}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className="modal-actions">
              <div>{editingId && <button type="button" className="btn-ghost" onClick={() => deleteProject(editingId)}>Hapus proyek</button>}</div>
              <div className="modal-actions-right">
                <button type="button" className="btn-secondary" onClick={() => setModalOpen(false)}>Batal</button>
                <button type="submit" className="btn-primary">Simpan</button>
              </div>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ProjectBoard />);
</script>
</body>
</html>
